{% if user.is_authenticated %}

<!-- ===== QUBIT BRAIN AI CHATBOT ASSISTANT ===== -->
<style>
  /* ===== ROOT VARIABLES & SCOPED WRAPPER ===== */
  #chatbot-wrapper {
    --cb-primary-dark: #0a2a3f;
    --cb-primary-mid: #1a5276;
    --cb-primary-blue: #2e86c1;
    --cb-accent-teal: #1abc9c;
    --cb-accent-cyan: #8cfae2;
    --cb-bg-card: #ffffff;
    --cb-bg-body: #f4f8fc;
    --cb-text-dark: #0a1e2b;
    --cb-text-mid: #2c4a62;
    --cb-text-light: #648299;
    --cb-border: #d2e3f0;
    --cb-user-bubble: linear-gradient(135deg, #1a5276, #2e86c1);
    --cb-bot-bubble: #ffffff;
    --cb-shadow: 0 20px 50px rgba(10, 42, 63, 0.28), 0 0 0 1px rgba(10, 42, 63, 0.08);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  }

  #chatbot-wrapper * {
    box-sizing: border-box;
  }

  /* ===== FLOATING TRIGGER BUTTON ===== */
  #chat-circle {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 99998;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0a2a3f 0%, #1a5276 50%, #2e86c1 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 8px 26px rgba(10, 42, 63, 0.4), 0 0 0 3px rgba(26, 188, 156, 0.4);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    animation: chatPulse 3s ease-in-out infinite;
  }

  #chat-circle:hover {
    transform: scale(1.1) rotate(5deg);
    box-shadow: 0 12px 34px rgba(10, 42, 63, 0.5), 0 0 0 4px rgba(26, 188, 156, 0.6);
  }

  #chat-circle i {
    font-size: 26px;
    color: #8cfae2;
    transition: transform 0.3s ease;
  }

  #chat-circle .chat-circle-badge {
    position: absolute;
    top: -2px;
    right: -2px;
    width: 16px;
    height: 16px;
    background: #1abc9c;
    border: 2px solid #ffffff;
    border-radius: 50%;
    animation: badgePulse 2s infinite;
  }

  @keyframes chatPulse {
    0%, 100% { box-shadow: 0 8px 26px rgba(10, 42, 63, 0.4), 0 0 0 3px rgba(26, 188, 156, 0.4); }
    50% { box-shadow: 0 8px 34px rgba(46, 134, 193, 0.55), 0 0 0 6px rgba(26, 188, 156, 0.2); }
  }

  @keyframes badgePulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.8; }
  }

  /* ===== CHAT BOX CONTAINER ===== */
  .chat-box {
    position: fixed;
    display: none;
    right: 28px;
    bottom: 104px;
    z-index: 99999;
    width: 385px;
    max-height: 590px;
    background: var(--cb-bg-card);
    border-radius: 22px;
    box-shadow: var(--cb-shadow);
    border: 1px solid var(--cb-border);
    overflow: hidden;
    animation: chatSlideUp 0.35s cubic-bezier(0.34, 1.45, 0.64, 1);
    flex-direction: column;
  }

  @keyframes chatSlideUp {
    0% { opacity: 0; transform: translateY(24px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Top Glowing Accent Line */
  .chat-box-accent {
    height: 4px;
    width: 100%;
    background: linear-gradient(90deg, #1abc9c, #2e86c1, #8cfae2, #2e86c1);
    background-size: 200% 100%;
    animation: chatAccentShimmer 4s ease infinite;
  }

  @keyframes chatAccentShimmer {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* ===== HEADER ===== */
  .chat-box-header {
    background: linear-gradient(135deg, #0a2a3f, #1a5276);
    color: #ffffff;
    padding: 14px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid rgba(26, 188, 156, 0.3);
  }

  .chat-box-header .header-brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chat-box-header .header-brand .brand-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
    border: 1.5px solid #1abc9c;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8cfae2;
    font-size: 16px;
  }

  .chat-box-header .header-brand .brand-text h4 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: -0.2px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .chat-box-header .header-brand .brand-text span {
    font-size: 11px;
    color: #8cfae2;
    display: flex;
    align-items: center;
    gap: 5px;
    font-weight: 500;
  }

  .chat-box-header .header-brand .brand-text .status-dot {
    width: 6px;
    height: 6px;
    background: #2ecc71;
    border-radius: 50%;
    box-shadow: 0 0 8px #2ecc71;
    display: inline-block;
  }

  .chat-header-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .chat-header-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.12);
    color: rgba(255, 255, 255, 0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s ease;
  }

  .chat-header-btn:hover {
    background: rgba(255, 255, 255, 0.25);
    color: #ffffff;
    transform: scale(1.06);
  }

  .chat-header-btn.btn-close:hover {
    background: rgba(231, 76, 60, 0.35);
    color: #ff7675;
  }

  /* ===== CONTROLS BAR (Language + Reading Toggle) ===== */
  .chat-controls {
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #edf5fb;
    border-bottom: 1px solid var(--cb-border);
  }

  .chat-lang-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    color: var(--cb-text-mid);
    font-weight: 600;
  }

  .chat-lang-pill i {
    color: var(--cb-primary-blue);
    font-size: 13px;
  }

  #voice-lang {
    padding: 4px 10px;
    border-radius: 16px;
    border: 1px solid var(--cb-border);
    background: #ffffff;
    color: var(--cb-text-dark);
    font-size: 11.5px;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s ease;
  }

  #voice-lang:focus {
    border-color: var(--cb-primary-blue);
  }

  /* Read Aloud Toggle Button (Disabled by default) */
  .chat-read-toggle-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 11px;
    border-radius: 16px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    border: 1px solid var(--cb-border);
    background: #ffffff;
    color: var(--cb-text-mid);
    transition: all 0.2s ease;
    outline: none;
  }

  .chat-read-toggle-btn:hover {
    color: var(--cb-primary-blue);
    border-color: var(--cb-primary-blue);
    background: #f0f7fc;
  }

  .chat-read-toggle-btn.active {
    background: rgba(26, 188, 156, 0.14);
    color: #138d75;
    border-color: #1abc9c;
  }

  .chat-read-toggle-btn i {
    font-size: 12px;
  }

  /* ===== CHAT BODY / LOGS ===== */
  .chat-box-body {
    padding: 16px;
    height: 330px;
    overflow-y: auto;
    background: var(--cb-bg-body);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chat-box-body::-webkit-scrollbar {
    width: 6px;
  }

  .chat-box-body::-webkit-scrollbar-thumb {
    background: #cbdce8;
    border-radius: 10px;
  }

  .chat-box-body::-webkit-scrollbar-thumb:hover {
    background: #a9c5db;
  }

  /* ===== SUGGESTION PILLS ===== */
  .chat-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 4px;
    padding-left: 42px;
  }

  .chat-suggestion-chip {
    background: #ffffff;
    border: 1px solid var(--cb-border);
    border-radius: 18px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 600;
    color: var(--cb-primary-mid);
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(10, 42, 63, 0.05);
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .chat-suggestion-chip:hover {
    background: #1a5276;
    color: #ffffff;
    border-color: #1a5276;
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(26, 82, 118, 0.2);
  }

  /* ===== MESSAGES ===== */
  .chat-msg {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: msgIn 0.25s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .chat-msg.self {
    flex-direction: row-reverse;
  }

  /* Avatars */
  .msg-avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 14px;
  }

  .chat-msg.user .msg-avatar {
    background: linear-gradient(135deg, #0a2a3f, #1a5276);
    color: #8cfae2;
    border: 1.5px solid #1abc9c;
    box-shadow: 0 2px 8px rgba(10, 42, 63, 0.15);
  }

  .chat-msg.self .msg-avatar {
    background: linear-gradient(135deg, #2e86c1, #1a5276);
    color: #ffffff;
    border: 1.5px solid #5dade2;
  }

  /* Message Bubbles */
  .cm-msg-content {
    display: flex;
    flex-direction: column;
    max-width: 78%;
  }

  .chat-msg.self .cm-msg-content {
    align-items: flex-end;
  }

  .cm-msg-text {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.48;
    word-break: break-word;
    box-shadow: 0 2px 8px rgba(10, 42, 63, 0.06);
  }

  /* Bot Message Bubble */
  .chat-msg.user .cm-msg-text {
    background: var(--cb-bot-bubble);
    color: var(--cb-text-dark);
    border: 1px solid var(--cb-border);
    border-bottom-left-radius: 4px;
  }

  /* User Message Bubble */
  .chat-msg.self .cm-msg-text {
    background: var(--cb-user-bubble);
    color: #ffffff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 3px 12px rgba(26, 82, 118, 0.25);
  }

  .cm-msg-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 3px;
    padding: 0 4px;
    width: 100%;
  }

  .cm-msg-time {
    font-size: 10px;
    color: var(--cb-text-light);
  }

  .cm-msg-read-btn {
    background: none;
    border: none;
    color: var(--cb-text-light);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 7px;
    border-radius: 12px;
    transition: all 0.15s ease;
    outline: none;
  }

  .cm-msg-read-btn:hover {
    color: var(--cb-primary-blue);
    background: rgba(46, 134, 193, 0.12);
  }

  .cm-msg-read-btn.speaking {
    color: #e67e22;
    background: rgba(230, 126, 34, 0.15);
    animation: speakPulse 1.2s infinite ease-in-out;
  }

  @keyframes speakPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  /* Typing Indicator Animation */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
    background: var(--cb-bot-bubble);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    border: 1px solid var(--cb-border);
    width: fit-content;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--cb-primary-blue);
    animation: typingBounce 1.4s infinite ease-in-out both;
  }

  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }

  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1.1); opacity: 1; }
  }

  /* ===== INPUT BAR ===== */
  .chat-input-wrapper {
    padding: 12px 14px;
    background: #ffffff;
    border-top: 1px solid var(--cb-border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #chat-input {
    flex: 1;
    padding: 10px 16px;
    border: 1.5px solid var(--cb-border);
    border-radius: 25px;
    outline: none;
    background: var(--cb-bg-body);
    color: var(--cb-text-dark);
    font-size: 13.5px;
    transition: all 0.2s ease;
  }

  #chat-input:focus {
    border-color: var(--cb-primary-blue);
    background: #ffffff;
    box-shadow: 0 0 0 3px rgba(46, 134, 193, 0.15);
  }

  #chat-input::placeholder {
    color: #9cb5c7;
    font-size: 13px;
  }

  .chat-action-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    color: #ffffff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .chat-submit {
    background: linear-gradient(135deg, #1a5276, #2e86c1);
    box-shadow: 0 3px 10px rgba(46, 134, 193, 0.3);
  }

  .chat-submit:hover:not(:disabled) {
    transform: scale(1.08);
    background: linear-gradient(135deg, #2e86c1, #3498db);
    box-shadow: 0 5px 14px rgba(46, 134, 193, 0.45);
  }

  .chat-submit:disabled {
    opacity: 0.55;
    cursor: not-allowed;
  }

  .chat-action-btn i {
    font-size: 15px;
  }

  /* ===== DARK MODE SUPPORT ===== */
  @media (prefers-color-scheme: dark) {
    #chatbot-wrapper {
      --cb-bg-card: #142433;
      --cb-bg-body: #0d1b26;
      --cb-text-dark: #e8f0f8;
      --cb-text-mid: #b0c8d8;
      --cb-text-light: #7a9bb5;
      --cb-border: #1f3a4a;
      --cb-bot-bubble: #172c3d;
      --cb-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .chat-controls {
      background: #11202c;
    }

    #voice-lang {
      background: #172c3d;
      border-color: #264357;
      color: #e8f0f8;
    }

    .chat-read-toggle-btn {
      background: #172c3d;
      border-color: #264357;
      color: #7a9bb5;
    }

    .chat-read-toggle-btn:hover {
      background: #1e3a50;
      color: #e8f0f8;
      border-color: #2e86c1;
    }

    .chat-read-toggle-btn.active {
      background: rgba(26, 188, 156, 0.22);
      color: #8cfae2;
      border-color: #1abc9c;
    }

    .cm-msg-read-btn {
      color: #7a9bb5;
    }

    .cm-msg-read-btn:hover {
      color: #8cfae2;
      background: rgba(46, 134, 193, 0.2);
    }

    .cm-msg-read-btn.speaking {
      color: #f39c12;
      background: rgba(243, 156, 18, 0.2);
    }

    .chat-suggestions .chat-suggestion-chip {
      background: #172c3d;
      border-color: #264357;
      color: #8cfae2;
    }

    .chat-suggestions .chat-suggestion-chip:hover {
      background: #1a5276;
      color: #ffffff;
      border-color: #1abc9c;
    }

    .chat-input-wrapper {
      background: #142433;
    }

    #chat-input {
      background: #0d1b26;
      border-color: #1f3a4a;
      color: #e8f0f8;
    }

    #chat-input:focus {
      background: #11202c;
      border-color: #2e86c1;
    }

    #chat-input::placeholder {
      color: #557288;
    }

    .typing-indicator {
      background: #172c3d;
      border-color: #1f3a4a;
    }
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 500px) {
    .chat-box {
      width: calc(100vw - 24px);
      right: 12px;
      bottom: 88px;
      max-height: 75vh;
    }
    #chat-circle {
      width: 54px;
      height: 54px;
      right: 16px;
      bottom: 20px;
    }
    #chat-circle i {
      font-size: 22px;
    }
  }
</style>

<div id="chatbot-wrapper">
  <!-- Floating Button -->
  <div id="chat-circle" title="Chat with AI Assistant" aria-label="Open AI Assistant">
    <i class="fas fa-robot"></i>
    <span class="chat-circle-badge"></span>
  </div>

  <!-- Chat Window -->
  <div class="chat-box" role="dialog" aria-label="Brain Tumor AI Chatbot">
    <div class="chat-box-accent"></div>

    <!-- Header -->
    <div class="chat-box-header">
      <div class="header-brand">
        <div class="brand-avatar">
          <i class="fas fa-brain"></i>
        </div>
        <div class="brand-text">
          <h4>Qubit AI Assistant</h4>
          <span><span class="status-dot"></span> Clinical Support Online</span>
        </div>
      </div>
      <div class="chat-header-actions">
        <button type="button" class="chat-header-btn" id="chat-clear-btn" title="Clear chat history" aria-label="Clear chat">
          <i class="fas fa-redo-alt"></i>
        </button>
        <button type="button" class="chat-header-btn btn-close" id="chat-close-btn" title="Close chat" aria-label="Close chat">
          <i class="fas fa-times"></i>
        </button>
      </div>
    </div>

    <!-- Language & Reading Toggle Controls -->
    <div class="chat-controls">
      <div class="chat-lang-pill">
        <i class="fas fa-globe"></i>
        <span>Language:</span>
        <select id="voice-lang" aria-label="Select response language"></select>
      </div>
      <button type="button" class="chat-read-toggle-btn active" id="toggle-read-btn" title="Auto-read is ON (click to turn OFF)" aria-label="Toggle auto-reading aloud">
        <i class="fas fa-volume-up"></i>
        <span>Read: <strong>On</strong></span>
      </button>
    </div>

    <!-- Chat Logs / Messages -->
    <div class="chat-box-body chat-logs" id="chatLogs">
      <!-- Injected dynamically -->
    </div>

    <!-- Input Bar -->
    <div class="chat-input-wrapper">
      <input type="text" id="chat-input" placeholder="Ask about brain tumors, MRI scans, symptoms..." autocomplete="off">
      <button type="button" class="chat-action-btn chat-submit" id="chat-submit" title="Send message" aria-label="Send message">
        <i class="fas fa-paper-plane"></i>
      </button>
    </div>
  </div>
</div>

<script>
(function() {
  // Deduplicate if included multiple times
  const wrappers = document.querySelectorAll('#chatbot-wrapper');
  if (wrappers.length > 1) {
    for (let i = 1; i < wrappers.length; i++) {
      wrappers[i].remove();
    }
  }
  if (window.__qubitChatbotInitialized) return;
  window.__qubitChatbotInitialized = true;

  // Language options
  const langOptions = [
    { lang: 'en-US', name: 'English' },
    { lang: 'hi-IN', name: 'Hindi (हिंदी)' },
    { lang: 'ta-IN', name: 'Tamil (தமிழ்)' },
    { lang: 'te-IN', name: 'Telugu (తెలుగు)' },
    { lang: 'kn-IN', name: 'Kannada (ಕನ್ನಡ)' },
    { lang: 'ml-IN', name: 'Malayalam (മലയാളം)' }
  ];

  function populateVoiceLang() {
    const select = document.getElementById('voice-lang');
    if (!select) return;
    select.innerHTML = '';
    langOptions.forEach(o => {
      const opt = document.createElement('option');
      opt.value = o.lang;
      opt.textContent = o.name;
      select.appendChild(opt);
    });
  }

  // Format timestamp (e.g., 9:41 PM)
  function getCurrentTimeString() {
    const now = new Date();
    return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Speech Synthesis (Text-to-Speech) management
  let isReadingEnabled = true; // Turned ON by default
  let activeSpeakBtn = null;

  function stopReading() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
    if (activeSpeakBtn) {
      activeSpeakBtn.classList.remove('speaking');
      activeSpeakBtn.innerHTML = '<i class="fas fa-volume-up"></i> <span>Listen</span>';
      activeSpeakBtn.title = "Read this response aloud";
      activeSpeakBtn = null;
    }
  }

  function readTextAloud(text, btnElement) {
    if (!('speechSynthesis' in window)) {
      return;
    }

    // If currently speaking this exact message, clicking toggles it off
    if (btnElement && activeSpeakBtn === btnElement && window.speechSynthesis.speaking) {
      stopReading();
      return;
    }

    // Stop any ongoing speech
    stopReading();

    // Strip HTML tags for clean spoken audio
    const cleanText = text.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    if (!cleanText) return;

    const utterance = new SpeechSynthesisUtterance(cleanText);
    const langSelect = document.getElementById('voice-lang');
    if (langSelect && langSelect.value) {
      utterance.lang = langSelect.value;
    } else {
      utterance.lang = 'en-US';
    }

    utterance.rate = 1.0;
    utterance.pitch = 1.0;

    if (btnElement) {
      activeSpeakBtn = btnElement;
      btnElement.classList.add('speaking');
      btnElement.innerHTML = '<i class="fas fa-stop"></i> <span>Stop</span>';
      btnElement.title = "Stop reading";
    }

    utterance.onend = function() {
      stopReading();
    };

    utterance.onerror = function() {
      stopReading();
    };

    window.speechSynthesis.speak(utterance);
  }

  function updateReadToggleUI() {
    const toggleBtn = document.getElementById('toggle-read-btn');
    if (!toggleBtn) return;
    if (isReadingEnabled) {
      toggleBtn.classList.add('active');
      toggleBtn.innerHTML = '<i class="fas fa-volume-up"></i> <span>Read: <strong>On</strong></span>';
      toggleBtn.title = "Auto-read is ON (click to turn OFF)";
    } else {
      toggleBtn.classList.remove('active');
      toggleBtn.innerHTML = '<i class="fas fa-volume-mute"></i> <span>Read: <strong>Off</strong></span>';
      toggleBtn.title = "Auto-read is OFF (click to turn ON)";
      stopReading();
    }
  }

  function toggleReadingMode() {
    isReadingEnabled = !isReadingEnabled;
    updateReadToggleUI();
  }

  // Toggle Chat Box
  let hasGreeted = false;

  function toggleChat(show) {
    const chatBox = document.querySelector('.chat-box');
    const chatCircle = document.getElementById('chat-circle');
    if (!chatBox) return;

    if (show) {
      chatBox.style.display = 'flex';
      if (chatCircle) chatCircle.style.display = 'none';

      // Greet only when user opens chatbot, not on page load or reload
      const logs = document.getElementById('chatLogs');
      if (!hasGreeted || (logs && logs.children.length === 0)) {
        renderWelcomeMessage(isReadingEnabled);
        hasGreeted = true;
      }

      setTimeout(() => {
        const input = document.getElementById('chat-input');
        if (input) input.focus();
      }, 100);
    } else {
      chatBox.style.display = 'none';
      if (chatCircle) chatCircle.style.display = 'flex';
      stopReading();
    }
  }

  // Append message to chat logs
  function appendMessage(text, sender, suggestions, autoSpeak = true) {
    const logs = document.getElementById('chatLogs');
    if (!logs) return;

    const isBot = sender === 'user'; // 'user' in backend views means bot response
    const msgDiv = document.createElement('div');
    msgDiv.className = `chat-msg ${sender}`;

    const avatarHtml = isBot
      ? `<div class="msg-avatar"><i class="fas fa-brain"></i></div>`
      : `<div class="msg-avatar"><i class="fas fa-user"></i></div>`;

    let suggestionsHtml = '';
    if (isBot && suggestions && suggestions.length > 0) {
      suggestionsHtml = `
        <div class="chat-suggestions">
          ${suggestions.map(s => `<button type="button" class="chat-suggestion-chip" data-prompt="${s.prompt}"><i class="${s.icon || 'fas fa-arrow-right'}"></i> ${s.label}</button>`).join('')}
        </div>
      `;
    }

    let footerHtml = '';
    if (isBot) {
      footerHtml = `
        <div class="cm-msg-footer">
          <span class="cm-msg-time">${getCurrentTimeString()}</span>
          <button type="button" class="cm-msg-read-btn" title="Read this response aloud" aria-label="Read response aloud">
            <i class="fas fa-volume-up"></i> <span>Listen</span>
          </button>
        </div>
      `;
    } else {
      footerHtml = `
        <div class="cm-msg-footer">
          <span class="cm-msg-time">${getCurrentTimeString()}</span>
        </div>
      `;
    }

    msgDiv.innerHTML = `
      ${avatarHtml}
      <div class="cm-msg-content">
        <div class="cm-msg-text">${text}</div>
        ${footerHtml}
        ${suggestionsHtml}
      </div>
    `;

    logs.appendChild(msgDiv);
    logs.scrollTop = logs.scrollHeight;

    // Attach click listeners to any chips in this message
    msgDiv.querySelectorAll('.chat-suggestion-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        const promptText = this.getAttribute('data-prompt');
        if (promptText) {
          const input = document.getElementById('chat-input');
          if (input) input.value = promptText;
          sendMessage();
        }
      });
    });

    // Attach click listener to listen/read button for bot message
    if (isBot) {
      const readBtn = msgDiv.querySelector('.cm-msg-read-btn');
      if (readBtn) {
        readBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          readTextAloud(text, readBtn);
        });
      }

      // If auto-read is enabled, read the response aloud
      if (isReadingEnabled && autoSpeak) {
        readTextAloud(text, readBtn);
      }
    }
  }

  // Typing indicator
  function showTypingIndicator() {
    removeTypingIndicator();
    const logs = document.getElementById('chatLogs');
    if (!logs) return;

    const typingDiv = document.createElement('div');
    typingDiv.className = 'chat-msg user typing-msg';
    typingDiv.id = 'chatTypingIndicator';
    typingDiv.innerHTML = `
      <div class="msg-avatar"><i class="fas fa-brain"></i></div>
      <div class="typing-indicator">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>
    `;
    logs.appendChild(typingDiv);
    logs.scrollTop = logs.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById('chatTypingIndicator');
    if (el) el.remove();
  }

  // Welcome message with quick suggestions
  function renderWelcomeMessage(autoSpeak = true) {
    stopReading();
    const logs = document.getElementById('chatLogs');
    if (!logs) return;
    logs.innerHTML = '';

    appendMessage(
      "Hello! I am your <strong>Qubit Brain AI Assistant</strong>. You can ask me questions about brain tumor types (Glioma, Meningioma, Pituitary), MRI analysis, symptoms, or how to use the segmentation model.",
      'user',
      [
        { label: "What is Glioma?", prompt: "What is a Glioma brain tumor and its symptoms?", icon: "fas fa-bolt" },
        { label: "Meningioma overview", prompt: "Explain Meningioma tumor characteristics and treatment.", icon: "fas fa-shield-alt" },
        { label: "How MRI model works", prompt: "How does the deep learning model segment brain tumors from MRI scans?", icon: "fas fa-microscope" }
      ],
      autoSpeak
    );
  }

  // Send message function
  function sendMessage() {
    const input = document.getElementById('chat-input');
    const submitBtn = document.getElementById('chat-submit');
    const langSelect = document.getElementById('voice-lang');
    if (!input) return;

    const text = input.value.trim();
    if (!text) return;

    const selectedLang = (langSelect && langSelect.value) || 'en-US';

    // Render user message immediately
    appendMessage(text, 'self');
    input.value = '';

    // Disable button and show typing dots
    if (submitBtn) submitBtn.disabled = true;
    showTypingIndicator();

    // Prepare CSRF Token
    const csrfToken = (function() {
      const match = document.cookie.match(/csrftoken=([^;]+)/);
      if (match) return match[1];
      const csrfInput = document.querySelector('input[name="csrfmiddlewaretoken"]');
      return csrfInput ? csrfInput.value : '';
    })();

    // Perform Fetch POST
    const formData = new URLSearchParams();
    formData.append('question', text);
    formData.append('language', selectedLang);
    if (csrfToken) formData.append('csrfmiddlewaretoken', csrfToken);

    fetch("{% url 'chatbot' %}", {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'X-Requested-With': 'XMLHttpRequest'
      },
      body: formData.toString()
    })
    .then(res => res.json())
    .then(data => {
      removeTypingIndicator();
      const reply = data.response || "I could not find an answer for that. Please try rephrasing your question.";
      appendMessage(reply, 'user');
    })
    .catch(err => {
      console.error("Chatbot request error:", err);
      removeTypingIndicator();
      appendMessage("Sorry, I encountered a connection error. Please try again in a moment.", 'user');
    })
    .finally(() => {
      if (submitBtn) submitBtn.disabled = false;
      input.focus();
    });
  }

  // Wire events
  function initChatbotEvents() {
    populateVoiceLang();
    updateReadToggleUI();

    const chatCircle = document.getElementById('chat-circle');
    const closeBtn = document.getElementById('chat-close-btn');
    const clearBtn = document.getElementById('chat-clear-btn');
    const submitBtn = document.getElementById('chat-submit');
    const input = document.getElementById('chat-input');
    const toggleReadBtn = document.getElementById('toggle-read-btn');

    if (chatCircle) {
      chatCircle.onclick = () => toggleChat(true);
    }

    if (closeBtn) {
      closeBtn.onclick = () => toggleChat(false);
    }

    if (clearBtn) {
      clearBtn.onclick = () => {
        hasGreeted = true;
        renderWelcomeMessage(isReadingEnabled);
      };
    }

    if (toggleReadBtn) {
      toggleReadBtn.onclick = () => toggleReadingMode();
    }

    if (submitBtn) {
      submitBtn.onclick = sendMessage;
    }

    if (input) {
      input.onkeypress = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          sendMessage();
        }
      };
    }

    // Notice: renderWelcomeMessage() is NOT called here on page load or reload.
    // It is triggered only when the user opens the chatbot via toggleChat(true).
  }

  document.addEventListener('DOMContentLoaded', initChatbotEvents);

  if (document.readyState === 'complete' || document.readyState === 'interactive') {
    initChatbotEvents();
  }
})();
</script>

{% endif %}
